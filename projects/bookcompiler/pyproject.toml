[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookcompiler"
version = "0.5.1"
description = "Compile books into cited frameworks and analyze new events."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pypdf>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bookcompiler = "bookcompiler.cli:main"
bookcompiler-switch = "bookcompiler.switch_models:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bookcompiler = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"